name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci ставит ровно то, что в package-lock.json, без обновления пакетов.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run eslint
      - run: npm run prettier:check
      - run: npm test
      - run: npm run build
